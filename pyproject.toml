[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "market-data-contracts"
version = "0.1.0"
description = "Versioned, provenance-first contracts for local market research collectors"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Michael Weems" }]
keywords = ["market-data", "pydantic", "json-schema", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
market-contracts-schema = "market_data_contracts.schema:main"

[project.urls]
Repository = "https://github.com/Milk-Master-Mike/market-data-contracts"
Issues = "https://github.com/Milk-Master-Mike/market-data-contracts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_contracts"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

